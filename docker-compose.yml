# Demo local da FieldOps API: API + PostgreSQL (PBI-0070). Guia: docs/DEPLOY_CONTAINER.md
#   cp .env.example .env && docker compose up --build
# Não é o fluxo de deploy EC2 (jar + systemd, ver docs/DEPLOY_EC2.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (cp .env.example .env)}
    volumes:
      - fieldops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${DEMO_PROFILES:-dev,postgres}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (>=32 chars) no .env (cp .env.example .env)}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fieldops}
      DATABASE_USER: ${POSTGRES_USER:-fieldops}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # O profile dev habilita o console H2; sem H2 em uso, não o exponha.
      SPRING_H2_CONSOLE_ENABLED: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  fieldops-pgdata:
