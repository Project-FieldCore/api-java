spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fieldops}
    username: ${DATABASE_USER:fieldops}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

fieldops:
  security:
    jwt:
      # JWT_SECRET is mandatory for postgres/runtime profiles (fail-fast if missing/short).
      secret: ${JWT_SECRET}
      access-ttl: 15m
      refresh-ttl: 7d
    cors:
      # Comma-separated list of exact origins (no wildcard). Set CORS_ALLOWED_ORIGINS per environment,
      # e.g. http://18.205.200.49 for the dev web panel.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-Request-Id
      max-age: 3600

logging:
  level:
    com.fieldops: INFO
