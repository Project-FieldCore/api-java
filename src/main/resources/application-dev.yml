spring:
  datasource:
    url: jdbc:h2:mem:fieldops;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

fieldops:
  security:
    jwt:
      access-ttl: 15m
      refresh-ttl: 7d
    cors:
      allowed-origins: http://localhost:3000,http://localhost:8081
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-Request-Id
      max-age: 3600

logging:
  level:
    com.fieldops: DEBUG
    org.springframework.security: INFO
