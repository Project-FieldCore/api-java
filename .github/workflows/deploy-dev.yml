name: "1. [Auto] Deploy — Development"

# Gate: PRs to develop must pass "0. [Auto] Pull Request Validation" (branch protection).
# This workflow packages with -DskipTests on push to develop; do not disable the PR gate.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  ARTIFACT_NAME: published-fieldops-api
  STAGE_DIR: /tmp/fieldops-api-github-deploy-dev
  LOGS_BACKUP: /tmp/fieldops-api-logs-backup-dev
  SPRING_PROFILES_ACTIVE: postgres
  SYSTEMD_SERVICE_FALLBACK: dev-fieldops-api.service
  PATCH_SCRIPT_ENVS: >-
    DEPLOY_TARGET,SPRING_PROFILES_ACTIVE,SERVER_PORT,SYSTEMD_SERVICE_NAME,SYSTEMD_SERVICE_FALLBACK,JWT_SECRET_B64,DATABASE_URL_B64,DATABASE_USER_B64,DATABASE_PASSWORD_B64

jobs:
  build-and-publish:
    name: Build & publish API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven package
        # Tests already ran on the PR that merged into develop (required status check).
        # postgresql driver is runtime-scoped in pom (needed for SPRING_PROFILES_ACTIVE=postgres).
        run: ./mvnw -B clean package -DskipTests

      - name: Stage publish artifact
        run: |
          mkdir -p publish
          cp target/fieldcore-backend-*.jar publish/fieldops-api.jar
          ls -la publish/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: publish/
          retention-days: 7

  deploy-ec2-dev:
    name: Deploy to EC2 DEV
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20
    steps:
      - name: Checkout (patch script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            .github/scripts

      - name: Download published artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./publish

      - name: Backup logs on EC2 DEV
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            LOGS="${{ vars.TARGET_DIR }}/logs"
            if [ -d "$LOGS" ]; then
              sudo rm -rf "${{ env.LOGS_BACKUP }}"
              sudo cp -a "$LOGS" "${{ env.LOGS_BACKUP }}"
              echo "Backup logs OK."
            else
              echo "Sem logs; pulando backup."
            fi

      - name: "SCP: stage publish to /tmp on EC2 DEV"
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "./publish/*"
          target: "${{ env.STAGE_DIR }}"
          strip_components: 1
          overwrite: true

      - name: Rsync + restore logs (DEV)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            STAGE="${{ env.STAGE_DIR }}"
            TARGET="${{ vars.TARGET_DIR }}"
            sudo mkdir -p "${TARGET}/logs"
            sudo rsync -a "${STAGE}/" "${TARGET}/"
            sudo rm -rf "${STAGE}"
            if [ -d "${{ env.LOGS_BACKUP }}" ]; then
              sudo rm -rf "${TARGET}/logs"
              sudo mv "${{ env.LOGS_BACKUP }}" "${TARGET}/logs"
              echo "Logs restaurados."
            fi
            sudo chown -R "$(whoami):$(whoami)" "${TARGET}" || true

      - name: Encode secrets (SSH-safe)
        id: secrets_b64
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          missing=0
          for name in JWT_SECRET DATABASE_URL DATABASE_USER DATABASE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} é obrigatório no Environment development."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error::JWT_SECRET deve ter pelo menos 32 caracteres."
            exit 1
          fi
          encode() { printf '%s' "$1" | base64 | tr -d '\n'; }
          {
            echo "jwt=$(encode "$JWT_SECRET")"
            echo "db_url=$(encode "$DATABASE_URL")"
            echo "db_user=$(encode "$DATABASE_USER")"
            echo "db_password=$(encode "$DATABASE_PASSWORD")"
          } >> "$GITHUB_OUTPUT"

      - name: Patch application + restart (DEV)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_TARGET: ${{ vars.TARGET_DIR }}
          SPRING_PROFILES_ACTIVE: ${{ env.SPRING_PROFILES_ACTIVE }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SYSTEMD_SERVICE_NAME: ${{ vars.SYSTEMD_SERVICE }}
          SYSTEMD_SERVICE_FALLBACK: ${{ env.SYSTEMD_SERVICE_FALLBACK }}
          JWT_SECRET_B64: ${{ steps.secrets_b64.outputs.jwt }}
          DATABASE_URL_B64: ${{ steps.secrets_b64.outputs.db_url }}
          DATABASE_USER_B64: ${{ steps.secrets_b64.outputs.db_user }}
          DATABASE_PASSWORD_B64: ${{ steps.secrets_b64.outputs.db_password }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script_path: .github/scripts/patch-application-ec2.sh
          envs: ${{ env.PATCH_SCRIPT_ENVS }}
