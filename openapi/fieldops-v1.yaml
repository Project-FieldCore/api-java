openapi: 3.0.3
info:
  title: FieldOps API
  version: 1.0.0
  description: Canonical initial contract for authentication, users and master data.
servers: [{url: http://localhost:8080, description: Local development}]
security: [{bearerAuth: []}]
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate a user
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}, example: {email: ana.silva@example.com, password: example-only-password}}}}
      responses: {'200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate a refresh token
      description: Reusing a previously rotated refresh token revokes its entire token family.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshTokenRequest'}}}}
      responses: {'200': {description: Refreshed, content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/v1/users:
    get: {tags: [Users], summary: Search, filter and paginate users, description: Requires the ADMIN role., parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Query'}, {name: status, in: query, schema: {$ref: '#/components/schemas/UserStatus'}}, {name: role, in: query, schema: {$ref: '#/components/schemas/UserRole'}}], responses: {'200': {description: Users, content: {application/json: {schema: {$ref: '#/components/schemas/UserPage'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {tags: [Users], summary: Create a user, description: Requires the ADMIN role., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUserRequest'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/users/{userId}:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    get: {tags: [Users], summary: Get a user, description: Requires the ADMIN role., responses: {'200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {tags: [Users], summary: Update a user, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateUserRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    put: {tags: [Users], summary: Replace a user, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateUserRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/clients:
    get: {tags: [Clients], summary: Search, filter and paginate clients, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Query'}, {name: status, in: query, schema: {$ref: '#/components/schemas/ActiveStatus'}}], responses: {'200': {description: Clients, content: {application/json: {schema: {$ref: '#/components/schemas/ClientPage'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {tags: [Clients], summary: Create a client, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateClientRequest'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/clients/{clientId}:
    parameters: [{$ref: '#/components/parameters/ClientId'}]
    get: {tags: [Clients], summary: Get a client, responses: {'200': {description: Client, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {tags: [Clients], summary: Update a client, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateClientRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    put: {tags: [Clients], summary: Replace a client, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateClientRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/clients/{clientId}/sites:
    parameters: [{$ref: '#/components/parameters/ClientId'}]
    get: {tags: [Sites], summary: List client sites, description: Requires ADMIN or SUPERVISOR. The client must exist., responses: {'200': {description: Sites, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Site'}}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    post: {tags: [Sites], summary: Create a site for a client, description: Requires ADMIN or SUPERVISOR. A site is always created under the client in the path., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteCreateInput'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/sites/{siteId}:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get: {tags: [Sites], summary: Get a site, description: Requires ADMIN or SUPERVISOR., responses: {'200': {description: Site, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {tags: [Sites], summary: Update a site, description: Requires ADMIN or SUPERVISOR. The client association is immutable., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteUpdateInput'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    put: {tags: [Sites], summary: Replace a site, description: Requires ADMIN or SUPERVISOR. The client association is immutable., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteUpdateInput'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    delete: {tags: [Sites], summary: Logically delete a site, description: Requires ADMIN or SUPERVISOR. The site is inactivated and preserved for history., requestBody: {required: true, content: {application/json: {schema: {type: object, required: [version], properties: {version: {type: integer, minimum: 0}}}}}}, responses: {'204': {description: Site inactivated}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/sites/{siteId}/equipment:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get: {tags: [Equipment], summary: List equipment belonging to a site, responses: {'200': {description: Equipment, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Equipment'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    post: {tags: [Equipment], summary: Create equipment linked to a site, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateEquipmentRequest'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/equipment/{equipmentId}:
    parameters: [{$ref: '#/components/parameters/EquipmentId'}]
    get: {tags: [Equipment], summary: Get equipment, responses: {'200': {description: Equipment, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {tags: [Equipment], summary: Update equipment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateEquipmentRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    put: {tags: [Equipment], summary: Replace equipment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateEquipmentRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/auth/logout:
    post: {tags: [Auth], summary: Revoke the current refresh token, responses: {'204': {description: Logged out}, '401': {$ref: '#/components/responses/Unauthorized'}}}
  /api/v1/auth/me:
    get: {tags: [Auth], summary: Get the authenticated user, responses: {'200': {description: Authenticated user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}}
  /api/v1/users/{userId}/status:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    patch: {tags: [Users], summary: Change a user's status, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusChangeRequest'}}}}, responses: {'200': {description: Updated user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/users/{userId}/reset-password:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    post: {tags: [Users], summary: Reset a user's password, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetRequest'}}}}, responses: {'204': {description: Password reset}, '400': {$ref: '#/components/responses/ValidationError'}}}
  /api/v1/clients/{clientId}/status:
    parameters: [{$ref: '#/components/parameters/ClientId'}]
    patch: {tags: [Clients], summary: Activate or logically inactivate a client, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientStatusChangeRequest'}}}}, responses: {'200': {description: Updated client, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/sites:
    get: {tags: [Sites], summary: Search, filter and paginate sites, description: Requires ADMIN or SUPERVISOR., parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Query'}, {name: status, in: query, schema: {$ref: '#/components/schemas/ActiveStatus'}}, {$ref: '#/components/parameters/ClientIdFilter'}], responses: {'200': {description: Sites, content: {application/json: {schema: {$ref: '#/components/schemas/SitePage'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/sites/{siteId}/status:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    patch: {tags: [Sites], summary: Change a site's status, description: Requires ADMIN or SUPERVISOR. Inactivation is logical and preserves history., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusChangeRequest'}}}}, responses: {'200': {description: Updated site, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/equipment:
    get: {tags: [Equipment], summary: Search, filter and paginate equipment, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Query'}, {name: status, in: query, schema: {$ref: '#/components/schemas/EquipmentStatus'}}, {$ref: '#/components/parameters/SiteIdFilter'}], responses: {'200': {description: Equipment, content: {application/json: {schema: {$ref: '#/components/schemas/EquipmentPage'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/equipment/by-qr/{qrCode}:
    parameters: [{name: qrCode, in: path, required: true, schema: {type: string}}]
    get: {tags: [Equipment], summary: Find equipment by QR code, responses: {'200': {description: Equipment, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  /api/v1/equipment/{equipmentId}/status:
    parameters: [{$ref: '#/components/parameters/EquipmentId'}]
    patch: {tags: [Equipment], summary: Change equipment status, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EquipmentStatusChangeRequest'}}}}, responses: {'200': {description: Updated equipment, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Sort: {name: sort, in: query, schema: {type: string, default: 'name,asc'}}
    Query: {name: q, in: query, schema: {type: string}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    ClientId: {name: clientId, in: path, required: true, schema: {type: string, format: uuid}}
    SiteId: {name: siteId, in: path, required: true, schema: {type: string, format: uuid}}
    EquipmentId: {name: equipmentId, in: path, required: true, schema: {type: string, format: uuid}}
    ClientIdFilter: {name: clientId, in: query, schema: {type: string, format: uuid}}
    SiteIdFilter: {name: siteId, in: query, schema: {type: string, format: uuid}}
  responses:
    ValidationError: {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {timestamp: '2026-10-22T21:00:00Z', status: 400, code: VALIDATION_ERROR, message: Validation failed, path: /api/v1/users, requestId: 16f1d8fd-6e42-489f-a919-4a09fd84dd5a, fieldErrors: [{field: email, message: must be a well-formed email address}]}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Insufficient permission, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Conflicting resource, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse: {type: object, required: [timestamp, status, code, message, path], properties: {timestamp: {type: string, format: date-time}, status: {type: integer}, code: {type: string}, message: {type: string}, path: {type: string}, requestId: {type: string}, fieldErrors: {type: array, items: {$ref: '#/components/schemas/FieldError'}}}}
    FieldError: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}
    LoginRequest: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, format: password, writeOnly: true, minLength: 8}}}
    RefreshTokenRequest: {type: object, required: [refreshToken], properties: {refreshToken: {type: string, writeOnly: true}}}
    TokenResponse: {type: object, required: [accessToken, refreshToken, expiresIn, user], properties: {accessToken: {type: string, readOnly: true}, refreshToken: {type: string, readOnly: true}, tokenType: {type: string, example: Bearer}, expiresIn: {type: integer, example: 900}, user: {$ref: '#/components/schemas/User'}}}
    UserRole: {type: string, enum: [ADMIN, SUPERVISOR, TECHNICIAN, CLIENT_VIEWER]}
    UserStatus: {type: string, enum: [ACTIVE, INACTIVE, BLOCKED]}
    ActiveStatus: {type: string, enum: [ACTIVE, INACTIVE]}
    EquipmentStatus: {type: string, enum: [ACTIVE, INACTIVE, DECOMMISSIONED]}
    User: {type: object, required: [id, name, email, role, status, version], properties: {id: {type: string, format: uuid}, name: {type: string}, email: {type: string, format: email}, role: {$ref: '#/components/schemas/UserRole'}, status: {$ref: '#/components/schemas/UserStatus'}, phone: {type: string, nullable: true}, version: {type: integer, minimum: 0}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    CreateUserRequest: {type: object, required: [name, email, password, role], properties: {name: {type: string}, email: {type: string, format: email}, password: {type: string, format: password, writeOnly: true}, role: {$ref: '#/components/schemas/UserRole'}, phone: {type: string}}}
    UpdateUserRequest: {type: object, required: [version], properties: {name: {type: string, maxLength: 160}, email: {type: string, format: email, maxLength: 320}, role: {$ref: '#/components/schemas/UserRole'}, phone: {type: string, nullable: true, maxLength: 32}, version: {type: integer, minimum: 0}}}
    Client: {type: object, required: [id, name, status, version], properties: {id: {type: string, format: uuid}, name: {type: string}, legalName: {type: string, nullable: true}, document: {type: string, nullable: true}, email: {type: string, format: email, nullable: true}, phone: {type: string, nullable: true}, status: {$ref: '#/components/schemas/ActiveStatus'}, version: {type: integer}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    CreateClientRequest: {type: object, required: [name], properties: {name: {type: string, maxLength: 160}, legalName: {type: string, maxLength: 255}, document: {type: string, maxLength: 64}, email: {type: string, format: email, maxLength: 320}, phone: {type: string, maxLength: 32}}}
    UpdateClientRequest: {type: object, required: [version], properties: {name: {type: string, maxLength: 160}, legalName: {type: string, maxLength: 255}, document: {type: string, maxLength: 64}, email: {type: string, format: email, maxLength: 320}, phone: {type: string, maxLength: 32}, version: {type: integer, minimum: 0}}}
    Site: {type: object, required: [id, clientId, name, status, version], properties: {id: {type: string, format: uuid}, clientId: {type: string, format: uuid}, name: {type: string}, description: {type: string, nullable: true}, city: {type: string, nullable: true}, state: {type: string, nullable: true}, status: {$ref: '#/components/schemas/ActiveStatus'}, version: {type: integer}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    SiteCreateInput: {type: object, required: [name], properties: {name: {type: string, maxLength: 160}, description: {type: string, maxLength: 1000}, addressLine: {type: string, maxLength: 255}, city: {type: string, maxLength: 120}, state: {type: string, maxLength: 120}, postalCode: {type: string, maxLength: 32}, latitude: {type: number, minimum: -90, maximum: 90}, longitude: {type: number, minimum: -180, maximum: 180}, contactName: {type: string, maxLength: 160}, contactPhone: {type: string, maxLength: 32}}}
    SiteUpdateInput: {type: object, required: [version], properties: {name: {type: string, maxLength: 160}, description: {type: string, maxLength: 1000}, addressLine: {type: string, maxLength: 255}, city: {type: string, maxLength: 120}, state: {type: string, maxLength: 120}, postalCode: {type: string, maxLength: 32}, latitude: {type: number, minimum: -90, maximum: 90}, longitude: {type: number, minimum: -180, maximum: 180}, contactName: {type: string, maxLength: 160}, contactPhone: {type: string, maxLength: 32}, version: {type: integer, minimum: 0}}}
    Equipment: {type: object, required: [id, siteId, name, qrCode, status, version], properties: {id: {type: string, format: uuid}, siteId: {type: string, format: uuid}, name: {type: string}, assetNumber: {type: string, nullable: true}, serialNumber: {type: string, nullable: true}, qrCode: {type: string}, status: {$ref: '#/components/schemas/EquipmentStatus'}, version: {type: integer}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    CreateEquipmentRequest: {type: object, required: [name, qrCode], properties: {name: {type: string, maxLength: 160}, qrCode: {type: string, maxLength: 255}, assetNumber: {type: string, maxLength: 100}, serialNumber: {type: string, maxLength: 100}, manufacturer: {type: string, maxLength: 160}, model: {type: string, maxLength: 160}, description: {type: string, maxLength: 1000}, installedAt: {type: string, format: date}}}
    UpdateEquipmentRequest: {type: object, required: [version], properties: {name: {type: string, maxLength: 160}, qrCode: {type: string, maxLength: 255}, assetNumber: {type: string, maxLength: 100}, serialNumber: {type: string, maxLength: 100}, manufacturer: {type: string, maxLength: 160}, model: {type: string, maxLength: 160}, description: {type: string, maxLength: 1000}, installedAt: {type: string, format: date}, version: {type: integer, minimum: 0}}}
    StatusChangeRequest: {type: object, required: [status, version], properties: {status: {type: string}, version: {type: integer, minimum: 0}}}
    EquipmentStatusChangeRequest: {type: object, required: [status, version], properties: {status: {$ref: '#/components/schemas/EquipmentStatus'}, version: {type: integer, minimum: 0}}}
    ClientStatusChangeRequest: {type: object, required: [status, version], properties: {status: {$ref: '#/components/schemas/ActiveStatus'}, version: {type: integer, minimum: 0}}}
