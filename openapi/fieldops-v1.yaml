    ErrorResponse: {type: object, required: [timestamp, status, code, message, path], properties: {timestamp: {type: string, format: date-time}, status: {type: integer}, code: {type: string}, message: {type: string}, path: {type: string}, requestId: {type: string}, fieldErrors: {type: array, items: {$ref: '#/components/schemas/FieldError'}}}}
    FieldError: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}
