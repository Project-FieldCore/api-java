openapi: 3.0.3
info:
  title: FieldOps API
  version: 1.0.0
  description: Canonical initial contract for authentication, users and master data.
servers: [{url: http://localhost:8080, description: Local development}]
security: [{bearerAuth: []}]
paths:
  /api/v1/dashboard/indicators:
    get: {tags: [Dashboard], summary: Get dashboard indicators, description: Requires ADMIN or SUPERVISOR. Returns inspection totals by state and open nonconformity totals by severity, including zero-value categories., responses: {'200': {description: Dashboard indicators, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardIndicators'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate a user
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}, example: {email: ana.silva@example.com, password: example-only-password}}}}
      responses: {'200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate a refresh token
      description: Reusing a previously rotated refresh token revokes its entire token family.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshTokenRequest'}}}}
      responses: {'200': {description: Refreshed, content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/v1/users:
    get: {tags: [Users], summary: Search, filter and paginate users, description: Requires the ADMIN role., parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Query'}, {name: status, in: query, schema: {$ref: '#/components/schemas/UserStatus'}}, {name: role, in: query, schema: {$ref: '#/components/schemas/UserRole'}}], responses: {'200': {description: Users, content: {application/json: {schema: {$ref: '#/components/schemas/UserPage'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {tags: [Users], summary: Create a user, description: Requires the ADMIN role., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUserRequest'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/users/{userId}:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    get: {tags: [Users], summary: Get a user, description: Requires the ADMIN role., responses: {'200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {tags: [Users], summary: Update a user, description: Requires the ADMIN role., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateUserRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    put: {tags: [Users], summary: Replace a user, description: Requires the ADMIN role., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateUserRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/clients:
    get: {tags: [Clients], summary: Search, filter and paginate clients, description: Requires ADMIN or SUPERVISOR., parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Query'}, {name: status, in: query, schema: {$ref: '#/components/schemas/ActiveStatus'}}], responses: {'200': {description: Clients, content: {application/json: {schema: {$ref: '#/components/schemas/ClientPage'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {tags: [Clients], summary: Create a client, description: Requires ADMIN or SUPERVISOR., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateClientRequest'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/clients/{clientId}:
    parameters: [{$ref: '#/components/parameters/ClientId'}]
    get: {tags: [Clients], summary: Get a client, responses: {'200': {description: Client, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {tags: [Clients], summary: Update a client, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateClientRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    put: {tags: [Clients], summary: Replace a client, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateClientRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/clients/{clientId}/sites:
    parameters: [{$ref: '#/components/parameters/ClientId'}]
    get: {tags: [Sites], summary: List client sites, description: Requires ADMIN or SUPERVISOR., responses: {'200': {description: Sites, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Site'}}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    post: {tags: [Sites], summary: Create a site for a client, description: Requires ADMIN or SUPERVISOR. Every site must belong to an existing client., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteCreateInput'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/sites/{siteId}:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get: {tags: [Sites], summary: Get a site, description: Requires ADMIN or SUPERVISOR., responses: {'200': {description: Site, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {tags: [Sites], summary: Update a site, description: Requires ADMIN or SUPERVISOR. The client association is immutable., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteUpdateInput'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    put: {tags: [Sites], summary: Replace a site, description: Requires ADMIN or SUPERVISOR. The client association is immutable., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteUpdateInput'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    delete: {tags: [Sites], summary: Logically delete a site, description: Requires ADMIN or SUPERVISOR. The site is inactivated and preserved for history., requestBody: {required: true, content: {application/json: {schema: {type: object, required: [version], properties: {version: {type: integer, minimum: 0}}}}}}, responses: {'204': {description: Site inactivated}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/sites/{siteId}/equipment:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get: {tags: [Equipment], summary: List equipment belonging to a site, description: Requires ADMIN or SUPERVISOR., responses: {'200': {description: Equipment, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Equipment'}}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    post: {tags: [Equipment], summary: Create equipment linked to a site, description: Requires ADMIN or SUPERVISOR., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateEquipmentRequest'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/equipment/{equipmentId}:
    parameters: [{$ref: '#/components/parameters/EquipmentId'}]
    get: {tags: [Equipment], summary: Get equipment, description: Requires ADMIN or SUPERVISOR., responses: {'200': {description: Equipment, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {tags: [Equipment], summary: Update equipment, description: Requires ADMIN or SUPERVISOR., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateEquipmentRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    put: {tags: [Equipment], summary: Replace equipment, description: Requires ADMIN or SUPERVISOR., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateEquipmentRequest'}}}}, responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    delete: {tags: [Equipment], summary: Logically delete equipment, description: Requires ADMIN or SUPERVISOR. Sets status to INACTIVE., requestBody: {required: true, content: {application/json: {schema: {type: object, required: [version], properties: {version: {type: integer, minimum: 0}}}}}}, responses: {'204': {description: Equipment inactivated}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token family
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshTokenRequest'}}}}
      responses: {'204': {description: Logged out}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/v1/auth/me:
    get: {tags: [Auth], summary: Get the authenticated user profile, responses: {'200': {description: Authenticated profile, content: {application/json: {schema: {$ref: '#/components/schemas/AuthProfile'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}}
  /api/v1/users/{userId}/status:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    patch: {tags: [Users], summary: Change a user's status, description: Requires the ADMIN role., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusChangeRequest'}}}}, responses: {'200': {description: Updated user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/clients/{clientId}/status:
    parameters: [{$ref: '#/components/parameters/ClientId'}]
    patch: {tags: [Clients], summary: Activate or logically inactivate a client, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientStatusChangeRequest'}}}}, responses: {'200': {description: Updated client, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/sites:
    get: {tags: [Sites], summary: Search, filter and paginate sites, description: Requires ADMIN or SUPERVISOR., parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Query'}, {name: status, in: query, schema: {$ref: '#/components/schemas/ActiveStatus'}}, {$ref: '#/components/parameters/ClientIdFilter'}], responses: {'200': {description: Sites, content: {application/json: {schema: {$ref: '#/components/schemas/SitePage'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/sites/{siteId}/status:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    patch: {tags: [Sites], summary: Change a site's status, description: Requires ADMIN or SUPERVISOR. Inactivation is logical and preserves history., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusChangeRequest'}}}}, responses: {'200': {description: Updated site, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/equipment:
    get: {tags: [Equipment], summary: Search, filter and paginate equipment, description: Requires ADMIN or SUPERVISOR., parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {$ref: '#/components/parameters/Sort'}, {$ref: '#/components/parameters/Query'}, {name: status, in: query, schema: {$ref: '#/components/schemas/EquipmentStatus'}}, {$ref: '#/components/parameters/SiteIdFilter'}], responses: {'200': {description: Equipment, content: {application/json: {schema: {$ref: '#/components/schemas/EquipmentPage'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/equipment/by-qr/{qrCode}:
    parameters: [{name: qrCode, in: path, required: true, schema: {type: string}}]
    get: {tags: [Equipment], summary: Find equipment by QR code, description: Requires ADMIN or SUPERVISOR. QR code lookup does not grant additional access., responses: {'200': {description: Equipment, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /api/v1/equipment/{equipmentId}/qr-code:
    parameters: [{$ref: '#/components/parameters/EquipmentId'}]
    patch: {tags: [Equipment], summary: Assign a unique QR code, description: Requires ADMIN or SUPERVISOR. The QR code is unique across all equipment., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QrCodeAssignment'}}}}, responses: {'200': {description: Updated equipment, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/equipment/{equipmentId}/status:
    parameters: [{$ref: '#/components/parameters/EquipmentId'}]
    patch: {tags: [Equipment], summary: Change equipment status, description: Requires ADMIN or SUPERVISOR., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EquipmentStatusChangeRequest'}}}}, responses: {'200': {description: Updated equipment, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspection-templates:
    post: {tags: [Inspection templates], summary: Create a draft inspection template, description: Requires ADMIN or SUPERVISOR. Creates DRAFT template plus an unpublished template_version (version_number=1). Response includes draftVersionId for section/item endpoints., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionTemplateCreateRequest'}}}}, responses: {'201': {description: Draft created, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionTemplate'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspection-templates/{templateId}:
    parameters: [{name: templateId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Inspection templates], summary: Get an inspection template, description: Requires ADMIN or SUPERVISOR., responses: {'200': {description: Inspection template, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionTemplate'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {tags: [Inspection templates], summary: Update a draft inspection template, description: Requires ADMIN or SUPERVISOR. Only DRAFT templates are editable., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionTemplateUpdateRequest'}}}}, responses: {'200': {description: Updated draft, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionTemplate'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
    put: {tags: [Inspection templates], summary: Replace a draft inspection template, description: Requires ADMIN or SUPERVISOR. Only DRAFT templates are editable., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionTemplateUpdateRequest'}}}}, responses: {'200': {description: Updated draft, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionTemplate'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspection-templates/{templateId}/publish:
    parameters: [{name: templateId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [Inspection templates], summary: Publish an immutable template version, description: Requires a DRAFT template with at least one section and one typed item. Editing after publication creates a new draft version., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublishTemplateRequest'}}}}, responses: {'200': {description: Published template, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionTemplate'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/template-sections/{sectionId}/items:
    parameters: [{name: sectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Inspection templates], summary: List template section items, description: Requires ADMIN or SUPERVISOR., responses: {'200': {description: Template items, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TemplateItem'}}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    post: {tags: [Inspection templates], summary: Create a template item, description: Requires ADMIN or SUPERVISOR. Items can be added only to sections of DRAFT templates. SINGLE_CHOICE requires options. Failure flags apply only to CONFORMITY., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateItemCreateRequest'}}}}, responses: {'201': {description: Item created, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateItem'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/template-sections/{sectionId}/items/{itemId}:
    parameters: [{name: sectionId, in: path, required: true, schema: {type: string, format: uuid}}, {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch: {tags: [Inspection templates], summary: Update a template item, description: Requires ADMIN or SUPERVISOR. Only DRAFT templates are editable. Omitting a field keeps the current value. Failure flags (observation/evidence on failure) persist only for CONFORMITY; other types store them as false. SINGLE_CHOICE requires unique options., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateItemUpdateRequest'}}}}, responses: {'200': {description: Item updated, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateItem'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/template-versions/{templateVersionId}/sections:
    parameters: [{name: templateVersionId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Inspection templates], summary: List ordered checklist sections, responses: {'200': {description: Sections, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TemplateSection'}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
    post: {tags: [Inspection templates], summary: Create checklist section, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTemplateSectionRequest'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateSection'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/template-versions/{templateVersionId}/sections/order:
    patch: {tags: [Inspection templates], summary: Reorder checklist sections, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReorderTemplateSectionsRequest'}}}}, responses: {'200': {description: Ordered sections, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TemplateSection'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/mobile/sync/pull:
    get: {tags: [Mobile sync], summary: Pull offline changes by opaque cursor, description: Requires TECHNICIAN. Returns up to 100 merged changes (INSPECTION/INSPECTION_RESPONSE UPSERT and INSPECTION DELETE tombstones) for the authenticated technician only. Cursor is opaque instant|uuid exclusive lower bound; omit/empty bootstraps from epoch. Malformed cursor returns 400 VALIDATION_ERROR. serverTime is Instant.now() captured once per request. lastPullCursor on push remains ignored., parameters: [{name: cursor, in: query, required: false, schema: {type: string}, description: Opaque pull cursor (ISO-8601-msZ|uuid). Omit or empty for bootstrap.}], responses: {'200': {description: Change page, content: {application/json: {schema: {$ref: '#/components/schemas/MobileSyncPullResponse'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/mobile/sync/push:
    post: {tags: [Mobile sync], summary: Push a batch of offline operations, description: Requires TECHNICIAN. Operations run in dependency order, each in its own transaction. A failed operation stays failed, dependents are not applied, and earlier operations in the batch stay applied. Retrying an operationId that was APPLIED, REJECTED or DEPENDENCY_FAILED returns ALREADY_APPLIED. A version mismatch returns CONFLICT for that operation only (HTTP 200), with the current inspection version and the stored answer, and does not record a receipt so the same operationId can be sent again after analysis. lastPullCursor is accepted and ignored., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MobileSyncPushRequest'}}}}, responses: {'200': {description: Per-operation results, content: {application/json: {schema: {$ref: '#/components/schemas/MobileSyncPushResponse'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/inspections:
    get: {tags: [Inspections], summary: List inspections for administrative monitoring, description: Requires ADMIN or SUPERVISOR. Supports explicit status, scheduled date range, technician and client filters., parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {name: sort, in: query, schema: {type: string, default: 'scheduledFor,asc', enum: ['scheduledFor,asc', 'scheduledFor,desc', 'status,asc', 'status,desc', 'priority,asc', 'priority,desc', 'createdAt,asc', 'createdAt,desc']}}, {name: status, in: query, schema: {$ref: '#/components/schemas/InspectionStatus'}}, {name: scheduledFrom, in: query, schema: {type: string, format: date-time}}, {name: scheduledTo, in: query, schema: {type: string, format: date-time}}, {name: technicianId, in: query, schema: {type: string, format: uuid}}, {name: clientId, in: query, schema: {type: string, format: uuid}}], responses: {'200': {description: Inspection page, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionPage'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {tags: [Inspections], summary: Schedule an inspection, description: Requires ADMIN or SUPERVISOR. Requires a published template version, client, compatible site, active technician and future scheduled date. New inspections start ASSIGNED and preserve an item snapshot., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleInspectionRequest'}}}}, responses: {'201': {description: Inspection scheduled, content: {application/json: {schema: {$ref: '#/components/schemas/Inspection'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/review-queue:
    get: {tags: [Inspections], summary: List inspections awaiting review, description: Requires ADMIN or SUPERVISOR. Returns only SUBMITTED inspections and supports submitted date, technician and client filters., parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}, {name: sort, in: query, schema: {type: string, default: 'submittedAt,asc', enum: ['submittedAt,asc', 'submittedAt,desc', 'scheduledFor,asc', 'scheduledFor,desc', 'priority,asc', 'priority,desc']}}, {name: submittedFrom, in: query, schema: {type: string, format: date-time}}, {name: submittedTo, in: query, schema: {type: string, format: date-time}}, {name: technicianId, in: query, schema: {type: string, format: uuid}}, {name: clientId, in: query, schema: {type: string, format: uuid}}], responses: {'200': {description: Review queue page, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewQueuePage'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/inspections/my:
    get: {tags: [Inspections], summary: List my assigned inspections, description: Requires TECHNICIAN. Returns only inspections assigned to the authenticated technician, with client, site and equipment names., responses: {'200': {description: Assigned inspections, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AssignedInspection'}}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/inspections/my/{inspectionId}:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Inspections], summary: Detail of an assigned inspection, description: Requires TECHNICIAN and ownership., responses: {'200': {description: Inspection detail, content: {application/json: {schema: {$ref: '#/components/schemas/AssignedInspection'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /api/v1/inspections/my/{inspectionId}/checklist:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Inspections], summary: Checklist snapshot for the technician, responses: {'200': {description: Sections and items copied at scheduling time, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InspectionChecklistSection'}}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  /api/v1/inspections/my/{inspectionId}/confirm-equipment:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/OperationId'}, {$ref: '#/components/parameters/ClientMutationId'}]
    post: {tags: [Inspections], summary: Confirm the inspection equipment by QR code, description: Requires TECHNICIAN and ownership. The code must belong to an active equipment of the inspection site. An inspection without equipment is bound to that asset. A different asset returns EQUIPMENT_MISMATCH., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmEquipmentRequest'}}}}, responses: {'200': {description: Equipment confirmed, content: {application/json: {schema: {$ref: '#/components/schemas/AssignedInspection'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/my/{inspectionId}/start:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/OperationId'}, {$ref: '#/components/parameters/ClientMutationId'}]
    post: {tags: [Inspections], summary: Start an assigned inspection, description: Records the server timestamp and an optional device timestamp. Moves ASSIGNED to IN_PROGRESS., requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/StartInspectionRequest'}}}}, responses: {'200': {description: Inspection started, content: {application/json: {schema: {$ref: '#/components/schemas/AssignedInspection'}}}}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/my/{inspectionId}/items/{itemId}/evidence:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}, {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/OperationId'}, {$ref: '#/components/parameters/ClientMutationId'}]
    post: {tags: [Inspections], summary: Attach a photo to a checklist item, description: Requires TECHNICIAN, ownership and an inspection in progress. Accepts JPEG, PNG or WebP up to 5 MB and stores it on the item response., requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}}, responses: {'200': {description: Evidence stored, content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceFile'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/my/{inspectionId}/items/{itemId}/observation:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}, {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/OperationId'}, {$ref: '#/components/parameters/ClientMutationId'}]
    put: {tags: [Inspections], summary: Save an item observation, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionObservationRequest'}}}}, responses: {'200': {description: Observation saved, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionChecklistItem'}}}}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/my/{inspectionId}/non-conformities:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/OperationId'}, {$ref: '#/components/parameters/ClientMutationId'}]
    get: {tags: [Inspections], summary: List nonconformities of my inspection, responses: {'200': {description: Nonconformities, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InspectionNonConformity'}}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
    post: {tags: [Inspections], summary: Register a nonconformity with severity and evidence, description: Requires TECHNICIAN, an inspection in progress and at least one photo already stored on the item., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NonConformityRequest'}}}}, responses: {'201': {description: Nonconformity registered, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionNonConformity'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/my/{inspectionId}/complete:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/OperationId'}, {$ref: '#/components/parameters/ClientMutationId'}]
    post: {tags: [Inspections], summary: Complete an inspection when rules are met, description: Blocks completion while a required answer, a failure observation or failure evidence is missing., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteInspectionRequest'}}}}, responses: {'200': {description: Inspection submitted, content: {application/json: {schema: {$ref: '#/components/schemas/AssignedInspection'}}}}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/{inspectionId}/monitoring:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Inspections], summary: View synchronized evidence and nonconformities, description: Requires ADMIN or SUPERVISOR. Returns evidence and nonconformities already stored for the inspection., responses: {'200': {description: Monitoring details, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionMonitoring'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /api/v1/inspections/{inspectionId}/audit:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Inspections], summary: List inspection state-transition audit events, description: Requires ADMIN or SUPERVISOR. Returns chronological audit_event rows for the inspection (action, actor, JSON payload with from/to, createdAt). No secrets. Actions include SCHEDULED, ASSIGNED, STARTED, SUBMITTED, CANCELED, REVIEW_STARTED, REVIEW_APPROVED, REVIEW_REJECTED. Technician gets 403., responses: {'200': {description: Audit trail, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InspectionAuditEvent'}}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /api/v1/inspections/{inspectionId}/checklist:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Inspections], summary: Read checklist answers for review, description: Requires ADMIN or SUPERVISOR. Read-only aggregation of snapshot items and technician responses by section. Same shape as the technician checklist. Does not allow editing answers., responses: {'200': {description: Sections with items and answers, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InspectionChecklistSection'}}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /api/v1/inspections/{inspectionId}/evidence/{evidenceId}/content:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}, {name: evidenceId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {tags: [Inspections], summary: Download one evidence file, description: Requires ADMIN or SUPERVISOR. Returns the stored bytes of a JPEG, PNG or WebP photo that belongs to the inspection. Content-Type matches the stored image type. Cache-Control is private., responses: {'200': {description: Evidence bytes, headers: {Cache-Control: {schema: {type: string, example: private}}, Content-Type: {schema: {type: string, enum: [image/jpeg, image/png, image/webp]}}}, content: {image/jpeg: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}, image/webp: {schema: {type: string, format: binary}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /api/v1/inspections/{inspectionId}/assignee:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch: {tags: [Inspections], summary: Assign an inspection to an active technician, description: Requires ADMIN or SUPERVISOR. The assigned user must have TECHNICIAN role and ACTIVE status. Inspection transitions to ASSIGNED., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignTechnicianRequest'}}}}, responses: {'200': {description: Inspection assigned, content: {application/json: {schema: {$ref: '#/components/schemas/Inspection'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/{inspectionId}/review/start:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [Inspections], summary: Start formal review, description: Requires ADMIN or SUPERVISOR. Moves a SUBMITTED inspection to UNDER_REVIEW and writes audit_event action REVIEW_STARTED (entity INSPECTION). If the inspection is already UNDER_REVIEW, returns 200 with the current inspection and does not insert another audit row (idempotent). Other statuses return 409 INSPECTION_NOT_REVIEWABLE. After start, the inspection leaves the SUBMITTED-only review queue., responses: {'200': {description: Inspection under review, content: {application/json: {schema: {$ref: '#/components/schemas/Inspection'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/{inspectionId}/review/approve:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [Inspections], summary: Approve an inspection under review, description: Requires ADMIN or SUPERVISOR. Moves UNDER_REVIEW to APPROVED, sets approved_at, inserts inspection_review (decision APPROVED, reviewer_id, optional comentario, created_at) and audit_event REVIEW_APPROVED. Already APPROVED returns 200 with the current inspection without a second review/audit row (idempotent). Other statuses return 409 INSPECTION_NOT_REVIEWABLE. Approved inspections cannot be canceled (RN-030); technician mutation paths only allow IN_PROGRESS., requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ApproveInspectionRequest'}}}}, responses: {'200': {description: Inspection approved, content: {application/json: {schema: {$ref: '#/components/schemas/Inspection'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/{inspectionId}/review/reject:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [Inspections], summary: Reject an inspection under review, description: Requires ADMIN or SUPERVISOR. Moves UNDER_REVIEW to REJECTED. Body field motivo is required (RN-080); blank/missing → 400 VALIDATION_ERROR. Inserts inspection_review (decision REJECTED, reviewer_id, comment=motivo, created_at) and audit_event REVIEW_REJECTED. Already REJECTED returns 200 without a second review/audit row (idempotent). Other statuses return 409 INSPECTION_NOT_REVIEWABLE. Persists status+review for later technician sync (PBI-0062)., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RejectInspectionRequest'}}}}, responses: {'200': {description: Inspection rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Inspection'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /api/v1/inspections/{inspectionId}/cancel:
    parameters: [{name: inspectionId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch: {tags: [Inspections], summary: Cancel an inspection with a reason, description: Requires ADMIN or SUPERVISOR. Records the user, timestamp and reason. Approved inspections cannot be canceled through this endpoint., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancelInspectionRequest'}}}}, responses: {'200': {description: Inspection canceled, content: {application/json: {schema: {$ref: '#/components/schemas/Inspection'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    OperationId: {name: X-Operation-Id, in: header, description: Unique id generated by the client for this retryable operation. Reusing it replays the first successful response without executing the mutation again., schema: {type: string, minLength: 1, maxLength: 255}}
    ClientMutationId: {name: X-Client-Mutation-Id, in: header, description: Compatibility alias for X-Operation-Id. When both headers are sent, their values must match., schema: {type: string, minLength: 1, maxLength: 255}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Sort: {name: sort, in: query, schema: {type: string, default: 'name,asc'}}
    Query: {name: q, in: query, schema: {type: string}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    ClientId: {name: clientId, in: path, required: true, schema: {type: string, format: uuid}}
    SiteId: {name: siteId, in: path, required: true, schema: {type: string, format: uuid}}
    EquipmentId: {name: equipmentId, in: path, required: true, schema: {type: string, format: uuid}}
    ClientIdFilter: {name: clientId, in: query, schema: {type: string, format: uuid}}
    SiteIdFilter: {name: siteId, in: query, schema: {type: string, format: uuid}}
  responses:
    ValidationError: {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {timestamp: '2026-10-22T21:00:00Z', status: 400, code: VALIDATION_ERROR, message: Validation failed, path: /api/v1/users, requestId: 16f1d8fd-6e42-489f-a919-4a09fd84dd5a, fieldErrors: [{field: email, message: must be a well-formed email address}]}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Insufficient permission, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Conflicting resource, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse: {type: object, required: [timestamp, status, code, message, path], properties: {timestamp: {type: string, format: date-time}, status: {type: integer}, code: {type: string}, message: {type: string}, path: {type: string}, requestId: {type: string}, fieldErrors: {type: array, items: {$ref: '#/components/schemas/FieldError'}}}}
    DashboardIndicators: {type: object, required: [generatedAt, inspectionsByStatus, openNonConformitiesBySeverity], properties: {generatedAt: {type: string, format: date-time}, inspectionsByStatus: {type: object, additionalProperties: {type: integer, format: int64}, description: Keys are InspectionStatus values; every state is present, including zero totals.}, openNonConformitiesBySeverity: {type: object, additionalProperties: {type: integer, format: int64}, description: Keys are LOW, MEDIUM, HIGH and CRITICAL; every severity is present and only OPEN nonconformities are counted.}}}
    FieldError: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}
    LoginRequest: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, format: password, writeOnly: true, minLength: 8}}}
    RefreshTokenRequest: {type: object, required: [refreshToken], properties: {refreshToken: {type: string, writeOnly: true}}}
    TokenResponse: {type: object, required: [accessToken, refreshToken, expiresIn, user], properties: {accessToken: {type: string, readOnly: true}, refreshToken: {type: string, readOnly: true}, tokenType: {type: string, example: Bearer}, expiresIn: {type: integer, example: 900}, user: {$ref: '#/components/schemas/AuthProfile'}}}
    AuthProfile: {type: object, required: [id, name, email, role], properties: {id: {type: string, format: uuid}, name: {type: string}, email: {type: string, format: email}, role: {$ref: '#/components/schemas/UserRole'}}}
    UserRole: {type: string, enum: [ADMIN, SUPERVISOR, TECHNICIAN, CLIENT_VIEWER]}
    UserStatus: {type: string, enum: [ACTIVE, INACTIVE, BLOCKED]}
    ActiveStatus: {type: string, enum: [ACTIVE, INACTIVE]}
    EquipmentStatus: {type: string, enum: [ACTIVE, INACTIVE, DECOMMISSIONED]}
    User: {type: object, required: [id, name, email, role, status, version], properties: {id: {type: string, format: uuid}, name: {type: string}, email: {type: string, format: email}, role: {$ref: '#/components/schemas/UserRole'}, status: {$ref: '#/components/schemas/UserStatus'}, phone: {type: string, nullable: true}, version: {type: integer, minimum: 0}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    CreateUserRequest: {type: object, required: [name, email, password, role], properties: {name: {type: string}, email: {type: string, format: email}, password: {type: string, format: password, writeOnly: true}, role: {$ref: '#/components/schemas/UserRole'}, phone: {type: string}}}
