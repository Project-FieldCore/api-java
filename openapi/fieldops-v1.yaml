    patch: {tags: [Inspections], summary: Assign an inspection to an active technician, description: Requires ADMIN or SUPERVISOR. The assigned user must have TECHNICIAN role and ACTIVE status. Inspection transitions to ASSIGNED., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignTechnicianRequest'}}}}, responses: {'200': {description: Inspection assigned, content: {application/json: {schema: {$ref: '#/components/schemas/Inspection'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
