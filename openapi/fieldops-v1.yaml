    CreateUserRequest: {type: object, required: [name, email, password, role], properties: {name: {type: string}, email: {type: string, format: email}, password: {type: string, format: password, writeOnly: true}, role: {$ref: '#/components/schemas/UserRole'}, phone: {type: string}}}
