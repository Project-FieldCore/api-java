    UserRole: {type: string, enum: [ADMIN, SUPERVISOR, TECHNICIAN, CLIENT_VIEWER]}
    UserStatus: {type: string, enum: [ACTIVE, INACTIVE, BLOCKED]}
    ActiveStatus: {type: string, enum: [ACTIVE, INACTIVE]}
